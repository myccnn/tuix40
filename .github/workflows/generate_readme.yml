name: Generate GitBlog README

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  label:
    types: [edited]
  push:
    branches:
      - main
    paths:
      - main.py

jobs:
  sync:
    name: Generate README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.actor == github.repository_owner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate new md
        run: |
          python main.py "${{ secrets.G_T }}" "${{ github.repository }}" --issue_number "${{ github.event.issue.number }}"

      - name: Push README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md BACKUP/*.md || true
          git diff --staged --quiet || (git commit -m "update new blog" && git push)
